[theme]
# Dark by default; viewers can still switch to Light or System from the ⋮ menu → Settings.
base = "dark"
primaryColor = "#4F46E5"            # indigo-600: white button text stays readable (~6:1)
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D29"
textColor = "#E6E8EF"

[server]
maxUploadSize = 5
