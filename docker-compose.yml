# Full local stack: Milvus (etcd + MinIO + standalone), FastAPI backend, Streamlit UI.
#   cp .env.example .env   # add ANTHROPIC_API_KEY, or set LLM_PROVIDER=mock
#   docker compose up --build
name: resume-optimizer

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd-data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes: [minio-data:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: [milvus-data:/var/lib/milvus]
    ports: ["19530:19530"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    env_file: [.env]
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
      CHECKPOINT_BACKEND: sqlite
      SQLITE_PATH: /app/data/checkpoints.sqlite
    volumes: [api-data:/app/data]
    ports: ["8000:8000"]
    depends_on:
      milvus: {condition: service_healthy}

  ui:
    build: {context: ., dockerfile: docker/ui.Dockerfile}
    environment:
      API_URL: http://api:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  api-data:
