# Full local stack: Milvus standalone, FastAPI backend, Streamlit UI.
#   cp .env.example .env   # add ANTHROPIC_API_KEY, or set LLM_PROVIDER=mock
#   docker compose up --build
name: resume-optimizer

services:
  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    # Embedded etcd + local storage: no separate etcd/MinIO containers (same mode as k8s/base/milvus.yaml).
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    configs:
      - source: embed-etcd
        target: /milvus/configs/embedEtcd.yaml
    volumes: [milvus-data:/var/lib/milvus]
    ports: ["19530:19530"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    env_file: [.env]
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
      CHECKPOINT_BACKEND: sqlite
      SQLITE_PATH: /app/data/checkpoints.sqlite
    volumes: [api-data:/app/data]
    ports: ["8000:8000"]
    depends_on:
      milvus: {condition: service_healthy}

  ui:
    build: {context: ., dockerfile: docker/ui.Dockerfile}
    environment:
      API_URL: http://api:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    ports: ["8501:8501"]
    depends_on: [api]

configs:
  embed-etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://0.0.0.0:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'

volumes:
  milvus-data:
  api-data:
