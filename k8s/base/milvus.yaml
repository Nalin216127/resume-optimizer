# Milvus standalone with embedded etcd and local storage: one pod, one PVC.
# For HA at scale, replace with the Milvus Operator / Helm chart in cluster mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-embed-etcd
data:
  embedEtcd.yaml: |
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://0.0.0.0:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: '1000'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  labels: {app.kubernetes.io/name: milvus, app.kubernetes.io/part-of: resume-optimizer}
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: milvus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: milvus, app.kubernetes.io/part-of: resume-optimizer}
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.15
          args: ["milvus", "run", "standalone"]
          env:
            - {name: ETCD_USE_EMBED, value: "true"}
            - {name: ETCD_DATA_DIR, value: /var/lib/milvus/etcd}
            - {name: ETCD_CONFIG_PATH, value: /milvus/configs/embedEtcd.yaml}
            - {name: COMMON_STORAGETYPE, value: local}
          ports:
            - {name: grpc, containerPort: 19530}
            - {name: metrics, containerPort: 9091}
          readinessProbe:
            httpGet: {path: /healthz, port: 9091}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 9091}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/milvus}
            - {name: embed-etcd, mountPath: /milvus/configs/embedEtcd.yaml, subPath: embedEtcd.yaml}
      volumes:
        - name: embed-etcd
          configMap: {name: milvus-embed-etcd}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  labels: {app.kubernetes.io/name: milvus}
spec:
  selector: {app.kubernetes.io/name: milvus}
  ports:
    - {name: grpc, port: 19530, targetPort: grpc}
    - {name: metrics, port: 9091, targetPort: metrics}
