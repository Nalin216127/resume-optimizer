# NOT applied by kustomize. To use Gemini, pass --from-literal=GEMINI_API_KEY=... instead of the Anthropic key
# and set LLM_PROVIDER=gemini in configmap.yaml. Create the real secret out-of-band, e.g.:
#   kubectl -n resume-optimizer create secret generic resume-optimizer-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=API_AUTH_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 24) \
#     --from-literal=DATABASE_URL=postgresql://resume:<POSTGRES_PASSWORD>@postgres:5432/resume
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: resume-optimizer-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
  GEMINI_API_KEY: "replace-me"
  API_AUTH_TOKEN: "replace-me"
  POSTGRES_PASSWORD: "replace-me"
  DATABASE_URL: "postgresql://resume:replace-me@postgres:5432/resume"
