apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-optimizer-config
data:
  LLM_PROVIDER: auto   # every provider with a key: gemini -> openrouter -> openai_compat -> anthropic
  OPENROUTER_MODELS: "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-super-120b-a12b:free"
  EMBEDDING_BACKEND: auto
  ANTHROPIC_MODEL: claude-opus-5-5
  ANTHROPIC_REFUSAL_FALLBACK: "true"
  GEMINI_MODEL: gemini-flash-lite-latest
  GEMINI_FALLBACK_MODELS: gemini-flash-latest
  VECTOR_BACKEND: milvus
  MILVUS_URI: http://milvus:19530
  MILVUS_COLLECTION: resume_knowledge
  EMBEDDING_DIM: "384"
  CHECKPOINT_BACKEND: postgres
  QUALITY_THRESHOLD: "8.0"
  MAX_AUTO_REVISIONS: "2"
  SEED_ON_STARTUP: "false"
  CORS_ORIGINS: "*"
