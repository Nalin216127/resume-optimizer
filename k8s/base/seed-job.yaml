# Seeds the Milvus knowledge base once (idempotent: skips if the collection has rows).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-knowledge
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: seed-knowledge, app.kubernetes.io/part-of: resume-optimizer}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: seed
          image: ghcr.io/OWNER/resume-optimizer-api:latest
          command: ["python", "-m", "resume_optimizer.seed"]
          envFrom:
            - configMapRef: {name: resume-optimizer-config}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
