apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/OWNER/resume-optimizer-api
    newTag: "1.0.0"
  - name: ghcr.io/OWNER/resume-optimizer-ui
    newTag: "1.0.0"
patches:
  - target: {kind: HorizontalPodAutoscaler, name: api}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
